name: compose-smoke

# Sobe o docker-compose.yml com a imagem construída do código e confere o stack; também roda o teste dos scripts do Coolify.
# Só no PR: na main, o job edge do release-image refaz os dois testes.
on:
  pull_request:
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - 'database/migrations/**'
      - '.github/scripts/**'
      - 'tests/scripts/**'
      - '.github/workflows/compose-smoke.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scripts tests
        run: |
          bash tests/scripts/coolify-test.sh
          bash tests/scripts/only-docs-test.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A base vem do GHCR (pública); o runtime é construído aqui, lendo o cache que o edge grava.
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: fluxie-smoke:ci
          load: true
          cache-from: type=gha,scope=runtime

      - name: Compose smoke test
        run: bash docker/smoke/compose-smoke.sh fluxie-smoke:ci

  # Regra do compose: o compose do PR aplicado por cima da instalação da última Release. Barra antes do merge.
  upgrade:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: fluxie-smoke:ci
          load: true
          cache-from: type=gha,scope=runtime

      - name: Upgrade smoke test
        run: bash docker/smoke/upgrade-smoke.sh fluxie-smoke:ci
