name: security-scan

# Varreduras pesadas: imagem Docker e scan dinâmico contra o staging. Rodam por agendamento (segunda de manhã), sob demanda
# (`gh workflow run security-scan`) e, no PR, só a da imagem e quando muda o que ela olha. Separadas do `tests` para nunca travar o deploy.
on:
  pull_request:
    paths:
      - '.github/workflows/security-scan.yml'
      - 'docker/**'
      - 'composer.lock'
      - 'package-lock.json'
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # No PR que muda docker/base a base é a do branch: construída aqui (~80 s) e no lugar da imagem publicada do FROM, que
      # só muda depois do merge. No resto, inclusive agendado e manual, a base é a publicada, a que o deploy usa: uma base
      # defasada reprova aqui, e o remédio é rodar o base-image. O merge commit contra o primeiro pai dá só a mudança do PR
      # (o base.sha podia estar defasado). A referência é lida do docker/Dockerfile para não ficar fixa numa versão do PHP.
      - name: Detect base image changes
        id: base
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- docker/base; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"

      - name: Build the base image from this branch
        if: steps.base.outputs.changed == 'true'
        run: docker build -t fluxie-base:ci docker/base

      - name: Build the runtime image with the branch base
        if: steps.base.outputs.changed == 'true'
        run: |
          base_ref="$(sed -nE 's#^FROM ([^ ]+) AS base$#\1#p' docker/Dockerfile)"
          docker build --target runtime -f docker/Dockerfile --build-context "${base_ref}=docker-image://fluxie-base:ci" -t fluxie-scan:ci .

      # O Buildx não enxerga a base local, por isso o caminho da base mudada não usa cache.
      - name: Set up Buildx
        if: steps.base.outputs.changed != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the runtime image
        if: steps.base.outputs.changed != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: fluxie-scan:ci
          load: true
          cache-from: type=gha,scope=runtime

      # Falha só com vulnerabilidade CRÍTICA ou ALTA que já tenha correção: o que não tem correção publicada
      # não é acionável e deixaria o job vermelho para sempre.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fluxie-scan:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # Varre o staging (código da main), não o do PR: no PR seria um minuto de runner sem relação com a mudança.
  dynamic:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      # Varredura passiva (baseline do OWASP ZAP) contra o staging, que roda o código da main. Só relata: abrir issue
      # e reprovar o job ficam desligados até a primeira rodada ser triada.
      - name: ZAP baseline scan of the staging
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://staging.inbox.fluxie.com.br'
          allow_issue_writing: false
          fail_action: false
